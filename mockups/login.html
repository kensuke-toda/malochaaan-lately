<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lately（モック）— ログイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>body { background: #E8DFD0; color: #2F2A24; }</style>
</head>
<body class="font-['Nunito_Sans']" style="background-color:#E8DFD0;color:#2F2A24;">
  <div class="mx-auto flex min-h-screen max-w-sm flex-col justify-center px-4">
    <h1 class="mb-1 font-['Fraunces'] text-2xl font-semibold">Lately</h1>
    <p class="mb-6 text-sm text-[#6B6258]">アカウントでログインしてください</p>
    <form class="flex flex-col gap-3 rounded-2xl bg-[#F4EEE4] p-5">
      <input type="email" placeholder="メールアドレス" class="rounded-xl bg-[#E8DFD0] px-3 py-2 text-sm" />
      <input type="password" placeholder="パスワード" class="rounded-xl bg-[#E8DFD0] px-3 py-2 text-sm" />
      <button type="button" onclick="location.href='top.html'" class="rounded-full bg-[#B85C38] px-3 py-2.5 text-sm font-semibold text-[#F4EEE4]">ログイン</button>
    </form>
    <p class="mt-6 text-xs text-[#6B6258]">アカウントはKenが発行します。サインアップ画面はありません（G7-1決定済み）。</p>
    <footer class="mt-16 border-t border-[#2F2A24]/10 pt-6 text-xs text-[#6B6258]/50">Mockup（G1-4）</footer>
  </div>
</body>
</html>
